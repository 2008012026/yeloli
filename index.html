<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="叶罗丽契约">
<title>叶罗丽 · 契约选择</title>
<style>
:root{--bg:#0f0a1e;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#ece8ff;--muted:#a99fd0;--accent:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--txt);
background:radial-gradient(1200px 600px at 20% -10%,#3b1d6e 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#123b5e 0%,transparent 55%),var(--bg);background-attachment:fixed}
.app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);letter-spacing:.06em}
.brand{display:flex;align-items:center;gap:8px}.brand-mark{color:#f472b6;text-shadow:0 0 12px #f472b6}
.top-right{display:flex;align-items:center;gap:10px}.progress{font-variant-numeric:tabular-nums}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:15px}
.icon-btn.on{color:#ffd8a8;border-color:rgba(255,196,120,.5);box-shadow:0 0 14px rgba(255,196,120,.25)}
.stage{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:18px}
.portrait-wrap{display:flex;justify-content:center}
.portrait{width:150px;height:150px;border-radius:50%;filter:drop-shadow(0 12px 32px rgba(139,92,246,.35));animation:float 6s ease-in-out infinite}
.portrait svg{width:100%;height:100%;display:block;border-radius:50%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.doll-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#8b5cf6;color:#8b5cf6;box-shadow:0 0 12px currentColor}
.title{margin:16px 0 8px;font-size:clamp(18px,4.6vw,22px);line-height:1.4}
.text{white-space:pre-wrap;line-height:1.9;font-size:clamp(14.5px,3.8vw,16px);color:#ded9f5}
.choices{margin-top:20px;display:grid;gap:10px}
button.choice{text-align:left;padding:14px 16px;border-radius:14px;cursor:pointer;font-size:clamp(14px,3.7vw,15px);color:var(--txt);font-family:inherit;background:linear-gradient(180deg,rgba(139,92,246,.22),rgba(139,92,246,.08));border:1px solid rgba(139,92,246,.45);transition:.18s;min-height:48px}
button.choice:hover{transform:translateY(-1px);border-color:#a78bfa;box-shadow:0 10px 26px rgba(139,92,246,.28)}
button.choice:active{transform:translateY(0) scale(.99)}
.tags{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,196,120,.4);color:#ffd8a8;background:rgba(255,196,120,.08)}
.stats{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);display:grid;gap:10px}
.stat{display:grid;grid-template-columns:64px 1fr 30px;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8b5cf6,#f472b6);transition:width .4s}
.footer{display:flex;justify-content:space-between;align-items:center;padding-top:18px;font-size:12px;color:var(--muted)}
.ghost-btn{padding:9px 16px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);font-family:inherit}
.ghost-btn:hover{color:var(--txt);border-color:var(--accent)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:520px){.portrait{width:110px;height:110px}.panel{padding:18px;border-radius:16px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">❀</span><span>精灵梦叶罗丽 · 契约选择</span></div>
    <div class="top-right">
      <span class="progress" id="progress">1 / 20</span>
      <button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">♪</button>
    </div>
  </header>
  <main class="stage">
    <div class="portrait-wrap"><div class="portrait" id="portrait"></div></div>
    <section class="panel">
      <div class="doll-chip"><span class="dot" id="dot"></span><span id="dollName">尚未选择</span></div>
      <h1 class="title fade" id="title"></h1>
      <div class="text fade" id="text"></div>
      <div class="choices" id="choices"></div>
      <div class="tags" id="tags"></div>
      <div class="stats" id="stats"></div>
    </section>
  </main>
  <footer class="footer">
    <button class="ghost-btn" id="resetBtn">重新开始</button>
    <span class="hint">同人试玩 · 非商用</span>
  </footer>
</div>
<script>
/* ===== 剧情数据 ===== */
const STORY = {
"start":{"title":"序章 · 娃娃店","text":"放学后的巷子比记忆里更深。你追着一只纸蝴蝶拐进死胡同，却看见一扇从未注意过的木门。\n\n推开门，是一间落满光的娃娃店。橱窗里，七只娃娃同时抬起了头。\n\n「你终于来了。」最前面的那只轻声说。\n\n你要走向谁？","choices":[
{"text":"叶罗丽 —— 粉裙的花仙子","next":"luoli_1","doll":"叶罗丽"},
{"text":"蓝孔雀 —— 蓝裙的孔雀公主","next":"kongque_1","doll":"蓝孔雀"},
{"text":"茉莉 —— 紫裙的时间守卫","next":"moli_1","doll":"茉莉"},
{"text":"亮彩 —— 橙发的火焰舞者","next":"liangcai_1","doll":"亮彩"},
{"text":"黑香菱 —— 深紫的荆棘少女","next":"heixiangling_1","doll":"黑香菱"},
{"text":"菲灵 —— 金光里的倔强影子","next":"feiling_1","doll":"菲灵"},
{"text":"白光莹 —— 白裙的温暖光芒","next":"baiguangying_1","doll":"白光莹"}]},
"luoli_1":{"title":"叶罗丽 · 契约","text":"叶罗丽从橱窗里飘下来，裙摆的花瓣抖落成一圈微光。她仰头看你，眼睛里有点倔强：「我可以和你签订契约。但你得先答应我一件事——不管发生什么，都不许半途丢下我。」","choices":[
{"text":"我答应你，无论发生什么。","next":"luoli_2","flag":"trusted_doll","effect":{"爱心":2,"勇气":1}},
{"text":"先说清楚，契约要付出什么？","next":"luoli_2","effect":{"智慧":2}},
{"text":"……我还不确定。","next":"luoli_2","effect":{"暗影":1}}]},
"luoli_2":{"title":"叶罗丽 · 花瓣与裂缝","text":"契约成立的一瞬，你听见远处传来玻璃碎裂的声音。叶罗丽握住你的手：「那是黑暗的力量。从今天起，我们要一起面对它。」","choices":[
{"text":"那就一起去。","next":"first_attack","effect":{"爱心":1,"团结":1}},
{"text":"先弄清楚它从哪里来。","next":"first_attack","effect":{"智慧":1}}]},
"kongque_1":{"title":"蓝孔雀 · 审视","text":"蓝孔雀没有立刻回应，而是用尾羽扫过你的影子，像在审视一件作品。「品味不错。不过我要的搭档，得敢在所有人后退时往前走一步。」","choices":[
{"text":"那我先走这一步。","next":"kongque_2","effect":{"勇气":2,"智慧":1}},
{"text":"往前走之前，我想知道敌人在哪。","next":"kongque_2","effect":{"智慧":2}},
{"text":"你是在考验我？","next":"kongque_2","effect":{"智慧":1,"爱心":1}}]},
"kongque_2":{"title":"蓝孔雀 · 镜中之我","text":"镜子般的魔法在你面前展开，映出无数个你自己。蓝孔雀说：「选一个你愿意成为的。」","choices":[
{"text":"那个会保护别人的。","next":"first_attack","flag":"trusted_doll","effect":{"爱心":1,"团结":1}},
{"text":"那个看得最清楚的。","next":"first_attack","effect":{"智慧":1,"勇气":1}}]},
"moli_1":{"title":"茉莉 · 时间的条件","text":"茉莉安静地等你看完，才轻声开口：「时间会考验每一份契约。我可以给你力量，但你要答应我，永远不拿时间去换捷径。」","choices":[
{"text":"我答应。","next":"moli_2","flag":"trusted_doll","effect":{"智慧":1,"爱心":1}},
{"text":"如果捷径能救人呢？","next":"moli_2","effect":{"智慧":2}},
{"text":"时间真的能考验一切吗？","next":"moli_2","effect":{"智慧":1,"暗影":1}}]},
"moli_2":{"title":"茉莉 · 停住的秒针","text":"时钟的秒针停了一瞬。茉莉微笑：「你会问这个问题，说明你已经比很多人走得远了。」她伸出手。","choices":[
{"text":"握住她的手。","next":"first_attack","effect":{"智慧":1,"团结":1}},
{"text":"先问最后一个问题——你的时间，还剩多少？","next":"first_attack","effect":{"智慧":2,"牺牲":1}}]},
"liangcai_1":{"title":"亮彩 · 先比一场","text":"亮彩直接从橱窗里翻出来，落地时脚尖带起一圈火星：「签契约？行啊！但得先跟我比一场——赢了，我就认你这个搭档！」","choices":[
{"text":"比就比！","next":"liangcai_2","effect":{"勇气":2,"团结":1}},
{"text":"比可以，但我要先热身。","next":"liangcai_2","effect":{"智慧":1,"勇气":1}},
{"text":"输了你会怎样？","next":"liangcai_2","effect":{"智慧":2}}]},
"liangcai_2":{"title":"亮彩 · 三个花瓶","text":"一场追逐战在店里掀翻了三个花瓶。亮彩大笑着拍你的肩：「你行！从今天起，谁敢欺负你，先问过我的火！」","choices":[
{"text":"那以后并肩作战。","next":"first_attack","flag":"trusted_doll","effect":{"勇气":1,"团结":1}},
{"text":"下次规则我来定。","next":"first_attack","effect":{"勇气":1,"智慧":1}}]},
"heixiangling_1":{"title":"黑香菱 · 别过来","text":"黑香菱站在最暗的角落，荆棘从她袖口伸出又缩回。「别过来。靠近我的人，最后都会被扎伤。」她的声音很轻，像在道歉。","choices":[
{"text":"那我把手伸给你。","next":"heixiangling_2","flag":"trusted_doll","effect":{"爱心":2,"勇气":1}},
{"text":"你为什么这么说？","next":"heixiangling_2","effect":{"智慧":1,"爱心":1}},
{"text":"……你说得对。","next":"heixiangling_2","effect":{"暗影":2}}]},
"heixiangling_2":{"title":"黑香菱 · 荆棘开花","text":"她愣了很久，最后把一根荆棘轻轻放在你手心。荆棘没有刺破皮肤，反而开出了一朵小花。「那就……试试看吧。」","choices":[
{"text":"我们一起走。","next":"first_attack","flag":"redemption_seed","effect":{"爱心":1,"团结":1}},
{"text":"这朵花叫什么名字？","next":"first_attack","flag":"redemption_seed","effect":{"爱心":1,"智慧":1}},
{"text":"花很漂亮。但刺我留着。","next":"first_attack","effect":{"暗影":1,"勇气":1}}]},
"feiling_1":{"title":"菲灵 · 快要熄灭的光","text":"菲灵的光很微弱，像快要熄灭的烛火，却一直固执地亮着。她抬头看你：「我可能撑不了太久。你确定要选一个这样的我吗？」","choices":[
{"text":"能亮多久，我陪你多久。","next":"feiling_2","flag":"trusted_doll","effect":{"牺牲":2,"爱心":1}},
{"text":"告诉我，你的光在消耗什么？","next":"feiling_2","effect":{"智慧":2}},
{"text":"……我需要考虑一下。","next":"feiling_2","effect":{"暗影":1}}]},
"feiling_2":{"title":"菲灵 · 一半的命","text":"她笑了，那是最疲惫也最好看的笑。「契约成立。从现在起，我这条命有一半是你的了——别浪费它。」","choices":[
{"text":"不会浪费。","next":"first_attack","effect":{"牺牲":1,"团结":1}},
{"text":"命不是用来交换的。","next":"first_attack","effect":{"爱心":2}}]},
"baiguangying_1":{"title":"白光莹 · 你要用它做什么","text":"白光莹周身的光很暖，像冬日窗边的午后。她问：「你希望这份力量用来做什么？保护？照亮？还是……报复？」","choices":[
{"text":"保护。","next":"baiguangying_2","effect":{"爱心":2}},
{"text":"照亮。","next":"baiguangying_2","effect":{"团结":2}},
{"text":"报复。","next":"baiguangying_2","effect":{"暗影":2,"勇气":1}},
{"text":"我不知道。但我想先变得更强。","next":"baiguangying_2","effect":{"智慧":1,"勇气":1}}]},
"baiguangying_2":{"title":"白光莹 · 记住今天的答案","text":"她没有评判，只是把一缕光放进你掌心。「记住今天的答案。以后你会需要它。」","choices":[
{"text":"我记住了。","next":"first_attack","flag":"trusted_doll","effect":{"团结":1,"爱心":1}},
{"text":"如果有一天我忘了呢？","next":"first_attack","effect":{"智慧":1}}]},
"first_attack":{"title":"第一章 · 黑暗初现","variants":[
{"when":{"gte":{"暗影":2}},"text":"城市上空裂开一道缝，黑色藤蔓垂下来。奇怪的是，它们没有扑向你——它们在你脚边停住，像认出了什么。\n\n{doll}缓缓转头看你，眼神里有你读不懂的东西。「……它们为什么不攻击你？」\n\n藤蔓里传来一个温柔的声音：「因为你和我们，本来就是同一种人。」"},
{"when":{"flags":["trusted_doll"]},"text":"裂缝睁开时，街上的人还没完全撤离。一个小女孩摔倒在路中央，藤蔓正朝她垂下去。\n\n{doll}拉住你的手臂：「你去救她，我挡住那些东西！」","choices":[
{"text":"冲过去救小女孩。","next":"man_duo_la","effect":{"爱心":2,"团结":1}},
{"text":"先帮{doll}解决藤蔓，再去救人。","next":"man_duo_la","effect":{"智慧":2}},
{"text":"我两个都要。","next":"man_duo_la","effect":{"勇气":2,"牺牲":1}}]}],
"text":"城市上空裂开一道缝，黑色的藤蔓垂下来，缠住路灯和屋顶。\n\n{doll}在你耳边说：「来了。」\n\n第一波阴影正朝你们涌来。","choices":[
{"text":"冲上去，正面迎战。","next":"man_duo_la","effect":{"勇气":2}},
{"text":"先护住旁边的人。","next":"man_duo_la","effect":{"团结":2,"爱心":1}},
{"text":"找它的弱点。","next":"man_duo_la","effect":{"智慧":2}}]},
"man_duo_la":{"title":"第二章 · 曼多拉的低语","variants":[
{"when":{"flags":["trusted_doll"]},"text":"战斗的间隙，一个声音直接响在你脑子里：「多有天赋的孩子啊。把娃娃交给我，我可以给你想要的一切。」\n\n{doll}突然挡在你面前，用自己微弱的光去挡那道声音。\n\n「别听它的，」她说，「它最擅长说服人。」\n\n那个声音笑了：「你以为它真的护着你？它只是在保护契约而已。」","choices":[
{"text":"我不需要它护着。这是我们两个人的战斗。","next":"companion_crisis","effect":{"爱心":2,"团结":1}},
{"text":"娃娃，你告诉我——它说的是真的吗？","next":"companion_crisis","effect":{"智慧":2}},
{"text":"……你怎么知道我在害怕？","next":"companion_crisis","effect":{"暗影":2}}]},
{"when":{"gte":{"暗影":2}},"text":"那个声音没有藏在远处，它贴在你耳边，像老朋友一样：「你早就感觉到了吧？你和别人不一样。你不需要别人，也不需要被谁保护。」\n\n{doll}在你身后喊你的名字，声音很远。\n\n「来吧，」它说，「把手给我。」","choices":[
{"text":"我还没软弱到需要你。","next":"companion_crisis","effect":{"勇气":2}},
{"text":"……你能给我什么？","next":"companion_crisis","flag":"deal_with_man","effect":{"暗影":2}},
{"text":"退后。我要一个人待一会儿。","next":"companion_crisis","effect":{"暗影":1,"智慧":1}}]},
{"when":{"gte":{"智慧":2}},"text":"那个声音在你脑中响起，说得很动听。但你注意到——每次它说到关键处，都会停顿半拍。\n\n像在等你的反应。像在试探。\n\n{doll}低声说：「它在骗你。」\n\n你没有立刻回答。你在想：它为什么要骗我？它怕什么？","choices":[
{"text":"试探它，看它怕什么。","next":"companion_crisis","effect":{"智慧":2}},
{"text":"直接拒绝。","next":"companion_crisis","effect":{"勇气":2,"团结":1}},
{"text":"假装答应，套它的话。","next":"companion_crisis","effect":{"智慧":1,"暗影":1}}]}],
"text":"战斗的间隙，一个声音直接响在你脑子里：「多有天赋的孩子啊。把娃娃交给我，我可以给你想要的一切——不必再害怕，不必再弱小。」","choices":[
{"text":"做梦。","next":"companion_crisis","effect":{"勇气":1,"爱心":1}},
{"text":"……你怎么知道我害怕？","next":"companion_crisis","effect":{"暗影":2}},
{"text":"你想要什么？我可以谈。","next":"companion_crisis","flag":"deal_with_man","effect":{"智慧":2}}]},
"companion_crisis":{"title":"第三章 · 同伴危机","variants":[
{"when":{"gte":{"暗影":3}},"text":"阴影退去时，你发现{doll}不见了。\n\n地上只剩一枚裂开的契约石，里面传出她的声音：「别来找我……它想用我逼你做选择。」\n\n另一边，裂缝还在扩大。曼多拉的声音又响起来：「她在我这。想要她回来，就用你自己来换。」","choices":[
{"text":"我去换她。","next":"truth","flag":"sacrificed","effect":{"牺牲":2,"爱心":1}},
{"text":"先封裂缝。她没有那么脆弱。","next":"truth","effect":{"智慧":2}},
{"text":"我不按你说的做。我会找到第三种方法。","next":"truth","effect":{"勇气":2,"智慧":1}}]},
{"when":{"gte":{"团结":2}},"text":"阴影退去时，你发现一名同伴被拖进了废墟深处，而另一边的裂缝正在扩大。你只能先做一件事。\n\n{doll}看着你：「你决定。我跟着你。」","choices":[
{"text":"去救同伴。","next":"truth","flag":"saved_companion","effect":{"团结":2,"牺牲":1}},
{"text":"先封裂缝，否则更多人会受伤。","next":"truth","effect":{"智慧":2,"牺牲":1}},
{"text":"分头行动，我自己去追。","next":"truth","effect":{"勇气":2,"暗影":1}}]}],

/* ===== 引擎 ===== */
const COLORS={"叶罗丽":"#ff6fae","蓝孔雀":"#4f9dff","茉莉":"#8fbf6a","亮彩":"#ff9b3d","黑香菱":"#b98cff","菲灵":"#f5d34a","白光莹":"#e8f4ff"};
const FLAG_NAMES={trusted_doll:"信任",redemption_seed:"救赎之种",deal_with_man:"交易",saved_companion:"救人之选",sacrificed:"牺牲",found_truth:"真相"};
const CHAPTERS=['start','luoli_1','kongque_1','moli_1','liangcai_1','heixiangling_1','feiling_1','baiguangying_1','luoli_2','kongque_2','moli_2','liangcai_2','heixiangling_2','feiling_2','baiguangying_2','first_attack','man_duo_la','companion_crisis','truth','final_battle'];
const DOLL_ENDINGS={"叶罗丽":{node:"ending_luoli",check:s=>(s.stats["爱心"]||0)>=4},"蓝孔雀":{node:"ending_kongque",check:s=>(s.stats["智慧"]||0)>=4},"茉莉":{node:"ending_moli",check:s=>(s.stats["智慧"]||0)>=4},"亮彩":{node:"ending_liangcai",check:s=>(s.stats["勇气"]||0)>=4},"黑香菱":{node:"ending_heixiangling",check:s=>s.flags.includes("redemption_seed")&&(s.stats["爱心"]||0)>=3},"菲灵":{node:"ending_feiling",check:s=>(s.stats["牺牲"]||0)>=3},"白光莹":{node:"ending_baiguangying",check:s=>(s.stats["团结"]||0)>=4}};

function newState(){return{node:'start',doll:null,stats:{},flags:[]}}
function applyEffect(s,e){if(!e)return;for(const k in e)s.stats[k]=(s.stats[k]||0)+e[k]}
function matchWhen(s,w){if(!w)return true;if(w.doll&&!w.doll.includes(s.doll))return false;if(w.flags&&!w.flags.every(f=>s.flags.includes(f)))return false;if(w.notFlags&&w.notFlags.some(f=>s.flags.includes(f)))return false;if(w.gte)for(const k in w.gte)if((s.stats[k]||0)<w.gte[k])return false;if(w.lte)for(const k in w.lte)if((s.stats[k]||0)>w.lte[k])return false;return true}
function resolveNode(s){const b=STORY[s.node];if(!b)return null;let n=b;if(b.variants){for(const v of b.variants){if(matchWhen(s,v.when)){n=Object.assign({},b,v);break}}}const choices=(n.choices||[]).filter(c=>matchWhen(s,c.when));return Object.assign({},n,{choices})}
function computeEnding(s){const g=k=>s.stats[k]||0;const f=k=>s.flags.includes(k);if(f('deal_with_man')||g('暗影')>=6)return'ending_shadow';if(g('牺牲')>=5)return'ending_sacrifice';const de=DOLL_ENDINGS[s.doll];if(de&&de.check(s))return de.node;if(g('团结')>=6)return'ending_trust';if(g('智慧')>=6)return'ending_wisdom';if(g('勇气')>=6)return'ending_courage';if(f('redemption_seed'))return'ending_redemption';return'ending_light'}
function fill(t,s){return(t||'').replace(/\{doll\}/g,s.doll||'娃娃')}
function progressOf(s){let i=CHAPTERS.indexOf(s.node);if(i<0)i=CHAPTERS.length-1;return{current:i+1,total:CHAPTERS.length}}
function inferMood(name,node){if(node&&node.mood)return node.mood;if(name&&name.startsWith('ending_')){if(name==='ending_shadow'||name==='ending_sacrifice')return'sad';if(name==='ending_trust'||name==='ending_light'||name==='ending_luoli'||name==='ending_baiguangying')return'hopeful';return'ending'}if(name==='truth')return'sad';if(name==='man_duo_la')return'dark';if(name==='companion_crisis')return'tense';if(name==='first_attack'||name==='final_battle')return'battle';return'calm'}

function renderNode(s){
  const n=resolveNode(s);
  if(!n)return{title:'错误',text:'节点不存在。',choices:[],stats:s.stats,flags:s.flags,doll:s.doll,mood:'calm',progress:progressOf(s)};
  return{title:fill(n.title,s),text:fill(n.text,s),doll:s.doll,stats:s.stats,flags:s.flags,mood:inferMood(s.node,n),progress:progressOf(s),choices:(n.choices||[]).map(c=>({text:fill(c.text,s)}))}
}

/* ===== 存档 ===== */
const SID='yeloli_local_v1';
function loadState(){try{const raw=localStorage.getItem(SID);if(!raw)return newState();const s=JSON.parse(raw);if(!s||!s.node||!STORY[s.node])return newState();if(!s.stats)s.stats={};if(!s.flags)s.flags=[];return s}catch{return newState()}}
function saveState(s){try{localStorage.setItem(SID,JSON.stringify(s))}catch{}}
function resetState(){try{localStorage.removeItem(SID)}catch{}}

  const P=PALETTES[doll];
  if(!P)return`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="p-empty" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#2a2050"/><stop offset="100%" stop-color="#150f2c"/></radialGradient></defs><circle cx="100" cy="100" r="92" fill="url(#p-empty)"/><circle cx="100" cy="100" r="92" fill="none" stroke="#a99fd0" stroke-opacity="0.3" stroke-width="2"/><text x="100" y="112" font-size="46" text-anchor="middle" fill="#a99fd0" font-family="serif">❀</text></svg>`;
  return`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="bg-${P.key}" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="${P.bg1}"/><stop offset="100%" stop-color="${P.bg2}"/></radialGradient></defs><circle cx="100" cy="100" r="92" fill="url(#bg-${P.key})" opacity="0.92"/><circle cx="100" cy="100" r="92" fill="none" stroke="${P.accent}" stroke-opacity="0.55" stroke-width="2"/><circle cx="100" cy="100" r="78" fill="none" stroke="${P.accent}" stroke-opacity="0.25" stroke-width="1"/>${ICONS[P.icon](P)}</svg>`;
}

/* ===== BGM ===== */
const MOODS={calm:{root:220,scale:[0,4,7,12],bpm:60,wave:'sine',vol:0.10},tense:{root:146.83,scale:[0,3,7,10],bpm:96,wave:'triangle',vol:0.12},dark:{root:110,scale:[0,1,5,8],bpm:48,wave:'sawtooth',vol:0.06},hopeful:{root:261.63,scale:[0,4,7,11],bpm:72,wave:'sine',vol:0.10},battle:{root:174.61,scale:[0,3,7,12],bpm:120,wave:'square',vol:0.055},sad:{root:164.81,scale:[0,3,7,10],bpm:44,wave:'sine',vol:0.10},ending:{root:196,scale:[0,4,7,12],bpm:56,wave:'sine',vol:0.12}};

class MusicEngine{
  constructor(){this.ctx=null;this.master=null;this.current=null;this.timer=null;this.enabled=true}
  ensure(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.55;this.master.connect(this.ctx.destination)}catch(e){this.enabled=false}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}
  play(mood){if(!this.enabled)return;this.ensure();if(!this.ctx||this.current===mood)return;this.stopTimer();this.current=mood;const cfg=MOODS[mood]||MOODS.calm;let step=0;const tick=()=>{if(this.current!==mood)return;const semis=cfg.scale[step%cfg.scale.length];const freq=cfg.root*Math.pow(2,semis/12);this.note(freq,cfg.wave,cfg.vol,cfg);if(step%4===0)this.note(freq/2,'sine',cfg.vol*0.55,cfg);step++};tick();this.timer=setInterval(tick,60000/cfg.bpm)}
  note(freq,wave,vol,cfg){if(!this.ctx)return;const t=this.ctx.currentTime;const osc=this.ctx.createOscillator();const g=this.ctx.createGain();osc.type=wave;osc.frequency.value=freq;const dur=(60000/cfg.bpm/1000)*1.6;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.06);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);osc.connect(g);g.connect(this.master);osc.start(t);osc.stop(t+dur+0.05)}
  stopTimer(){if(this.timer){clearInterval(this.timer);this.timer=null}this.current=null}
  setEnabled(on){this.enabled=on;if(!on)this.stopTimer()}
}
const music=new MusicEngine();
let soundOn=localStorage.getItem('yeloli_sound')!=='off';
music.setEnabled(soundOn);

/* ===== 渲染 ===== */
let state=loadState();

function render(d){
  document.getElementById('dollName').textContent=d.doll||'尚未选择';
  const c=COLORS[d.doll]||'#8b5cf6';
  const dot=document.getElementById('dot');
  dot.style.background=c;dot.style.color=c;
  document.getElementById('portrait').innerHTML=portraitSVG(d.doll);
  document.getElementById('title').textContent=d.title;
  document.getElementById('text').textContent=d.text;
  document.getElementById('progress').textContent=`${d.progress.current} / ${d.progress.total}`;
  const box=document.getElementById('choices');
  box.innerHTML='';
  if(!d.choices.length){
    const tip=document.createElement('div');
    tip.style.color='#a99fd0';tip.style.fontSize='13px';
    tip.textContent='—— 本试玩到此结束 ——';
    box.appendChild(tip);
  }else{
    d.choices.forEach((ch,i)=>{
      const b=document.createElement('button');
      b.className='choice';b.textContent=ch.text;
      b.onclick=()=>choose(i);
      box.appendChild(b);
    });
  }
  const tagBox=document.getElementById('tags');
  tagBox.innerHTML='';
  (d.flags||[]).forEach(f=>{
    if(!FLAG_NAMES[f])return;
    const t=document.createElement('span');
    t.className='tag';t.textContent='命途 · '+FLAG_NAMES[f];
    tagBox.appendChild(t);
  });
  const st=document.getElementById('stats');
  st.innerHTML='';
  Object.keys(d.stats).sort().forEach(k=>{
    const v=d.stats[k];
    const row=document.createElement('div');
    row.className='stat';
    row.innerHTML=`<span>${k}</span><div class="bar"><i style="width:${Math.min(100,v*10)}%"></i></div><span>${v}</span>`;
    st.appendChild(row);
  });
  if(soundOn)music.play(d.mood);
  window.scrollTo({top:0,behavior:'smooth'});
}

function refresh(){render(renderNode(state))}

function choose(i){
  const node=resolveNode(state);
  const choice=node&&node.choices?node.choices[i]:null;
  if(!choice)return;
  if(choice.doll)state.doll=choice.doll;
  applyEffect(state,choice.effect);
  if(choice.flag){
    const arr=Array.isArray(choice.flag)?choice.flag:[choice.flag];
    arr.forEach(f=>{if(!state.flags.includes(f))state.flags.push(f)});
  }
  let next=choice.next;
  if(next==='@ending')next=computeEnding(state);
  state.node=STORY[next]?next:'start';
  saveState(state);
  refresh();
}

function reset(){
  resetState();
  state=newState();
  saveState(state);
  refresh();
}

/* ===== 事件 ===== */
const soundBtn=document.getElementById('soundBtn');
function syncSoundBtn(){soundBtn.classList.toggle('on',soundOn);soundBtn.textContent=soundOn?'♪':'∅'}
soundBtn.onclick=()=>{
  soundOn=!soundOn;
  localStorage.setItem('yeloli_sound',soundOn?'on':'off');
  music.setEnabled(soundOn);
  if(soundOn){music.play(renderNode(state).mood)}
  syncSoundBtn();
};
syncSoundBtn();
document.addEventListener('click',()=>music.ensure(),{once:true});
document.getElementById('resetBtn').onclick=reset;

refresh();
</script>
